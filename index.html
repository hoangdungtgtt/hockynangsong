<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học an toàn - Sống tự lập | THCS Tây Thái Ninh</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 15px;
    color: #2c3e50;
  }

  .book-container {
    width: 100%;
    max-width: 950px;
    perspective: 2000px;
  }

  .book {
    position: relative;
    width: 100%;
    min-height: 620px;
    background: #fdf6e3;
    border-radius: 10px;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.45),
      inset -1px 0 0 rgba(0, 0, 0, 0.05);
    padding: 45px 55px 30px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Gáy sách bên trái */
  .book::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 35px;
    background: linear-gradient(to right, rgba(0,0,0,0.18), rgba(0,0,0,0.05) 60%, transparent);
    pointer-events: none;
  }

  /* Hiệu ứng lật trang */
  .page-content {
    animation: pageTurn 0.45s ease;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  @keyframes pageTurn {
    from { opacity: 0; transform: translateX(25px) rotateY(-3deg); }
    to   { opacity: 1; transform: translateX(0) rotateY(0); }
  }

  /* ==== BÌA SÁCH ==== */
  .cover {
    text-align: center;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 500px;
    flex: 1;
  }
  .cover-icon {
    font-size: 5.5em;
    margin-bottom: 25px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .cover h1 {
    font-size: 2.4em;
    color: #5b2c8f;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 rgba(118, 75, 162, 0.15);
  }
  .cover .school {
    font-size: 1.15em;
    color: #764ba2;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .cover .program {
    color: #666;
    font-style: italic;
    margin-bottom: 30px;
  }
  .cover .hint {
    color: #764ba2;
    font-weight: 600;
    margin-top: 20px;
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  /* ==== BẢNG NỘI DUNG ==== */
  h1.page-title {
    text-align: center;
    color: #5b2c8f;
    margin-bottom: 8px;
    font-size: 1.75em;
  }
  .subtitle {
    text-align: center;
    color: #8e44ad;
    font-style: italic;
    margin-bottom: 22px;
    font-size: 1.05em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
  }
  th, td {
    padding: 11px 14px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 0.93em;
    vertical-align: top;
    line-height: 1.5;
  }
  th {
    background: linear-gradient(135deg, #764ba2, #5b2c8f);
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  tr:nth-child(even) td { background: #faf7ff; }
  tr:hover td { background: #f0e6ff; transition: background 0.2s; }
  tr:last-child td { border-bottom: none; }

  .stt-col {
    width: 50px;
    text-align: center;
    font-weight: 700;
    color: #764ba2;
  }
  .topic-col {
    width: 30%;
    font-weight: 600;
    color: #5b2c8f;
  }

  /* ==== KHỐI XÁC NHẬN (GỘP VÀO CUỐI BẢNG) ==== */
  .confirm-block {
    margin-top: 28px;
    padding: 26px 24px;
    background: linear-gradient(135deg, #f3ebff 0%, #fdf6e3 100%);
    border: 2px dashed #b39ddb;
    border-radius: 12px;
    text-align: center;
    animation: fadeConfirm 0.6s ease;
  }
  @keyframes fadeConfirm {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .confirm-block .cf-icon {
    font-size: 2.2em;
    margin-bottom: 8px;
  }
  .confirm-block h2 {
    color: #5b2c8f;
    font-size: 1.35em;
    margin-bottom: 8px;
  }
  .confirm-block p {
    color: #555;
    font-size: 0.95em;
    margin-bottom: 18px;
    line-height: 1.55;
  }
  .student-input {
    width: 100%;
    max-width: 420px;
    padding: 14px 18px;
    font-size: 1.05em;
    border: 2px solid #764ba2;
    border-radius: 10px;
    outline: none;
    transition: all 0.25s;
    margin-bottom: 16px;
    background: #fff;
    color: #2c3e50;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .student-input:focus {
    box-shadow: 0 0 0 5px rgba(118, 75, 162, 0.18);
    border-color: #5b2c8f;
  }
  .student-input:disabled {
    background: #f4f0fa;
    color: #888;
  }

  .agree-btn {
    padding: 14px 42px;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1.08em;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.25s;
    box-shadow: 0 5px 18px rgba(39, 174, 96, 0.45);
  }
  .agree-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(39, 174, 96, 0.6);
  }
  .agree-btn:active:not(:disabled) { transform: translateY(0); }
  .agree-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .status-msg {
    margin-top: 16px;
    font-weight: 600;
    min-height: 24px;
    font-size: 1em;
    transition: all 0.3s;
  }
  .status-msg.success { color: #27ae60; }
  .status-msg.error   { color: #e74c3c; }
  .status-msg.loading { color: #764ba2; }

  /* ==== SỐ TRANG ==== */
  .page-number {
    text-align: center;
    margin-top: 25px;
    color: #999;
    font-style: italic;
    font-size: 0.9em;
    letter-spacing: 0.5px;
  }

  /* ==== NÚT ĐIỀU HƯỚNG ==== */
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
  }
  button.nav-btn {
    flex: 1;
    padding: 14px 22px;
    background: linear-gradient(135deg, #764ba2, #5b2c8f);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: all 0.25s;
    box-shadow: 0 4px 14px rgba(118, 75, 162, 0.35);
  }
  button.nav-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5);
  }
  button.nav-btn:active:not(:disabled) { transform: translateY(0); }
  button.nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ==== TIẾN TRÌNH ==== */
  .progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 5px;
    margin-top: 18px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    border-radius: 5px;
    transition: width 0.4s ease;
  }

  /* ==== DÒNG BẢN QUYỀN ==== */
  .copyright {
    text-align: center;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #d4c5e8;
    font-size: 0.85em;
    color: #8e7ab5;
    font-style: italic;
    letter-spacing: 0.3px;
  }
  .copyright strong {
    color: #764ba2;
    font-style: normal;
  }

  /* ==== RESPONSIVE ==== */
  @media (max-width: 640px) {
    .book { padding: 28px 20px 20px; min-height: 560px; }
    .book::before { width: 20px; }
    th, td { font-size: 0.82em; padding: 8px 9px; }
    h1.page-title { font-size: 1.35em; }
    .cover h1 { font-size: 1.7em; }
    .cover-icon { font-size: 4em; }
    .topic-col { width: 35%; }
    .stt-col { width: 38px; }
    .confirm-block { padding: 20px 14px; }
    .confirm-block h2 { font-size: 1.15em; }
    .confirm-block p { font-size: 0.88em; }
    button.nav-btn { padding: 12px 14px; font-size: 0.92em; }
    .copyright { font-size: 0.78em; }
  }
</style>
</head>
<body>

<div class="book-container">
  <div class="book" id="book">
    <div id="pageContent" style="flex:1; display:flex; flex-direction:column;"></div>

  </div>

  <div class="nav-buttons">

  <div class="progress-bar">

  const ITEMS_PER_PAGE = 6;

  // Trang bìa
  pages.push({ type: 'cover' });

      isLastTable: (i + ITEMS_PER_PAGE >= data.length) // Đánh dấu trang cuối cùng của bảng

          <p class="school">TRƯỜNG THCS TÂY THÁI NINH</p>
          <p class="program">Chương trình giáo dục kỹ năng sống</p>
          <p class="hint">👉 Nhấn "Trang sau" để bắt đầu đọc nội dung</p>
          ${COPYRIGHT_HTML}
        </div>`;
      pageNumEl.textContent = "— Bìa sách —";
    }
    else if (page.type === 'table') {
      const rows = page.items.map(item => `
        <tr>
          <td class="stt-col">${item.stt}</td>
          <td class="topic-col">${item.topic}</td>
          <td>${item.result}</td>
        </tr>`).join('');

      // Nếu là trang bảng CUỐI CÙNG thì chèn khối xác nhận ngay sau bảng
      const confirmSection = page.isLastTable ? CONFIRM_HTML : '';

      container.innerHTML = `
        <div class="page-content">
          <h1 class="page-title">Chương trình Kỹ năng sống</h1>
          <div class="subtitle">"Học an toàn - Sống tự lập"</div>
          <table>
            <thead>
              <tr>
                <th>STT</th>
                <th>Chủ đề kỹ năng</th>
                <th>Kết quả kỳ vọng / Cơ sở đánh giá</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          ${confirmSection}
          ${COPYRIGHT_HTML}
        </div>`;

      const totalTablePages = pages.filter(p => p.type === 'table').length;
      const tablePageIdx = pages.slice(0, currentPage + 1).filter(p => p.type === 'table').length;
      pageNumEl.textContent = `Trang ${tablePageIdx} / ${totalTablePages}`;

      // Nếu là trang cuối có khối xác nhận, tự động cuộn xuống khối đó sau khi render
      if (page.isLastTable) {
        setTimeout(() => {
          const cf = document.getElementById('confirmBlock');
          if (cf) cf.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const inp = document.getElementById('studentName');
          // Không tự focus để tránh bàn phím mobile bật lên che nội dung; chỉ focus khi người dùng bấm
        }, 400);
      }
    }

    // Cập nhật nút điều hướng
    prevBtn.disabled = (currentPage === 0);
    nextBtn.disabled = (currentPage === pages.length - 1);

    // Cập nhật thanh tiến trình
    const progress = (currentPage / (pages.length - 1)) * 100;
    progressFill.style.width = progress + '%';

    // Cuộn lên đầu sách
    document.getElementById('book').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ============================================================
     CHUYỂN TRANG
     ============================================================ */
  function changePage(delta) {
    const newPage = currentPage + delta;
    if (newPage < 0 || newPage >= pages.length) return;
    currentPage = newPage;
    render();
  }

  /* ============================================================
     GỬI DỮ LIỆU LÊN GOOGLE SHEET
     ============================================================ */
  async function submitName() {
    const nameInput = document.getElementById('studentName');
    const statusMsg = document.getElementById('statusMsg');
    const agreeBtn = document.getElementById('agreeBtn');

    if (!nameInput || !statusMsg || !agreeBtn) return;

    const name = nameInput.value.trim().replace(/\s+/g, ' ');

    // Kiểm tra dữ liệu
    if (!name) {
      statusMsg.textContent = "⚠️ Vui lòng nhập họ và tên!";
      statusMsg.className = "status-msg error";
      nameInput.focus();
      return;
    }
    if (name.length < 2) {
      statusMsg.textContent = "⚠️ Họ tên quá ngắn, vui lòng kiểm tra lại!";
      statusMsg.className = "status-msg error";
      nameInput.focus();
      return;
    }
    if (!/[a-zA-ZÀ-ỹ]/.test(name)) {
      statusMsg.textContent = "⚠️ Họ tên không hợp lệ, vui lòng nhập lại!";
      statusMsg.className = "status-msg error";
      nameInput.focus();
      return;
    }

    // Vô hiệu hóa nút để tránh bấm nhiều lần
    agreeBtn.disabled = true;
    nameInput.disabled = true;
    statusMsg.textContent = "⏳ Đang gửi dữ liệu, vui lòng đợi...";
    statusMsg.className = "status-msg loading";

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });

      // Với no-cors, không đọc được response nhưng dữ liệu đã gửi thành công
      statusMsg.innerHTML = `✅ Cảm ơn <strong>${escapeHtml(name)}</strong>!<br>Em đã xác nhận đồng ý học thành công.`;
      statusMsg.className = "status-msg success";

      // Hiệu ứng chúc mừng
      confetti();
    }
    catch (err) {
      console.error('Lỗi gửi dữ liệu:', err);
      statusMsg.textContent = "❌ Có lỗi xảy ra, vui lòng thử lại!";
      statusMsg.className = "status-msg error";
      agreeBtn.disabled = false;
      nameInput.disabled = false;
    }
  }

  /* ============================================================
     HÀM HỖ TRỢ
     ============================================================ */
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Hiệu ứng pháo hoa nhỏ khi gửi thành công
  function confetti() {
    const colors = ['#f9d423', '#ff4e50', '#27ae60', '#764ba2', '#3498db'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.style.cssText = `
        position: fixed;
        top: 50%; left: 50%;
        width: 8px; height: 8px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: all 1s ease-out;
      `;
      document.body.appendChild(c);
      const angle = Math.random() * Math.PI * 2;
      const dist = 100 + Math.random() * 250;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;

      requestAnimationFrame(() => {
        c.style.transform = `translate(${x}px, ${y}px) scale(0)`;
        c.style.opacity = '0';
      });

      setTimeout(() => c.remove(), 1100);
    }
  }

  /* ============================================================
     KHỞI TẠO
     ============================================================ */
  render();

  // Hỗ trợ phím mũi tên trái/phải và Enter
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft')  changePage(-1);
    if (e.key === 'ArrowRight') changePage(1);
    if (e.key === 'Enter') {
      const btn = document.getElementById('agreeBtn');
      if (btn && !btn.disabled) submitName();
    }
  });
</script>
